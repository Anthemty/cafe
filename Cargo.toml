[package]
name = "cafe"
version = "0.2.1"
edition = "2021"
description = "A macOS menu bar keep-awake tool for agent coding sessions"
license = "MIT"
authors = ["Anthemty"]
repository = "https://github.com/Anthemty/cafe"
homepage = "https://github.com/Anthemty/cafe"
keywords = ["macos", "menu-bar", "caffeinate", "keep-awake", "agent"]
categories = ["os::macos-apis"]

[[bin]]
name = "cafe"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSProcessInfo", "NSNotification", "NSThread", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSColor", "NSGraphics", "NSRunningApplication", "NSEvent", "NSWindow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.8.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
